<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkSnip</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="spinner" class="spinner">
    <div class="spinner__icon"></div>
    <p class="spinner__text">Clipping page…</p>
  </div>

  <div id="container" class="container" hidden>
    <header class="header">
      <div class="header__brand">
        <img src="../icons/favicon-32x32.png" alt="" class="header__logo">
        <span class="header__title">MarkSnip</span>
      </div>
      <div class="header__actions">
        <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
        <a href="/options/options.html" id="optionsLink" class="icon-btn" target="_blank" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar__mode">
        <button id="modeSelection" class="segment segment--active" data-value="selection">Selection</button>
        <button id="modeDocument" class="segment" data-value="document">Document</button>
      </div>
      <input id="titleInput" class="toolbar__title" type="text" placeholder="Title">
    </div>

    <textarea id="editor" class="editor" spellcheck="false" placeholder="Markdown will appear here…"></textarea>

    <div class="char-count">
      <span id="charCount">0</span> characters
    </div>

    <footer class="actions">
      <button id="copyBtn" class="btn btn--primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
      <div class="actions__divider"></div>
      <button id="sendChatgpt" class="btn btn--ai" title="Send to ChatGPT">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22.28 9.82a5.99 5.99 0 0 0-.51-4.91 6.05 6.05 0 0 0-6.5-2.9A6.07 6.07 0 0 0 4.99 4.07 6 6 0 0 0 1 9.9a5.99 5.99 0 0 0 3.69 5.6 5.99 5.99 0 0 0 .51 4.91 6.05 6.05 0 0 0 6.5 2.9A6 6 0 0 0 22.4 18a5.99 5.99 0 0 0-3.69-5.6 5.95 5.95 0 0 0 3.57-2.58zM12.2 22.2a4.5 4.5 0 0 1-2.9-1.04l.14-.08 4.78-2.77c.24-.14.39-.4.39-.68V10.9l2.02 1.17v4.7a4.5 4.5 0 0 1-4.42 4.43zM3.5 18.3a4.5 4.5 0 0 1-.53-3.03l.14.09 4.78 2.77c.24.14.53.14.78 0L14.5 14v2.33l-4.04 2.33a4.5 4.5 0 0 1-6.96-2.37zM2.2 9.72a4.5 4.5 0 0 1 2.35-1.98v5.7c0 .28.15.54.39.68L10 16.9l-2.02 1.17-4.04-2.33a4.5 4.5 0 0 1-1.74-6.02zm15.57 3.64L12.96 9.9l2.02-1.17 4.04 2.33a4.5 4.5 0 0 1-.68 8.13v-5.7a.78.78 0 0 0-.57-.13zm2.01-3.02l-.14-.09L16.86 7.5a.78.78 0 0 0-.78 0L10 10.9V8.57l4.04-2.33a4.5 4.5 0 0 1 6.74 4.66v.44zM8.66 14.62L6.64 13.45V8.74a4.5 4.5 0 0 1 7.38-3.46l-.14.08L9.1 8.12a.78.78 0 0 0-.39.68l-.05 5.82zm1.1-2.37L12 10.74l2.24 1.29v2.59L12 15.91l-2.24-1.29v-2.37z"/></svg>
        ChatGPT
      </button>
      <button id="sendClaude" class="btn btn--ai" title="Send to Claude">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4.7 20.7c1.6 0 3-1.4 3-3.2 0-2.2-1.3-3.9-3-5.3.8 1.2 1.5 2.3 1.5 3.5 0 1.2-.8 1.8-1.5 1.8-.3 0-.7-.1-1-.4-.5-.5-.5-1.5 0-2.4.2-.4.5-.8.9-1.1C4 15 4.5 16.4 4.5 17.5c0 1.8-.8 3.2-2.2 3.2 1.2 0 1.6 0 2.4 0zm14.6-5.5c0-1.2.7-2.3 1.5-3.5-1.7 1.4-3 3.1-3 5.3 0 1.8 1.4 3.2 3 3.2.8 0 1.2 0 2.4 0-1.4 0-2.2-1.4-2.2-3.2 0-1.1.5-2.5 1.4-3.4.4.3.7.7.9 1.1.5.9.5 1.9 0 2.4-.3.3-.7.4-1 .4-.7 0-1.5-.6-1.5-1.8zM12 4c-3 0-5.3 2.3-5.3 5.3 0-1.5 1.2-2.7 2.7-2.7.5 0 1 .1 1.4.4.2-.7.4-1.5.4-2.3 0-.2 0-.5-.1-.7zm0 16c3 0 5.3-2.3 5.3-5.3 0 1.5-1.2 2.7-2.7 2.7-.5 0-1-.1-1.4-.4-.2.7-.4 1.5-.4 2.3 0 .2 0 .5.1.7zM5.3 9.3c0-1.5 1.2-2.7 2.7-2.7M18.7 14.7c0 1.5-1.2 2.7-2.7 2.7"/></svg>
        Claude
      </button>
      <button id="sendPerplexity" class="btn btn--ai" title="Send to Perplexity">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2L6.8 8.4v2.2L12 5.8l5.2 4.8V8.4L12 3.2zm0 5.5l-5.2 4.8v2.2L12 11.3l5.2 4.4v-2.2L12 8.7zm0 5.5L6.8 18.4v2.2L12 16.8l5.2 3.8v-2.2L12 14.2z"/></svg>
        Perplexity
      </button>
      <div id="customTargets" class="custom-targets"></div>
    </footer>
  </div>

  <div id="error" class="error" hidden></div>

  <script src="../browser-polyfill.min.js"></script>
  <script src="../shared/default-options.js"></script>
  <script src="popup.js"></script>
</body>
</html>
